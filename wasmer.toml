# Wasmer Edge package: serves the Laravel app with PHP's built-in server.
# Based on https://docs.wasmer.io/edge/guides/laravel
[dependencies]
"php/php" = "=8.3.4"

[fs]
"/app/" = "."

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "localhost:8080"]
